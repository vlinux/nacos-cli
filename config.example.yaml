# nacos-cli 配置文件示例
#
# 复制到 ~/.nacos-cli/config.yaml 后按需修改：
#   mkdir -p ~/.nacos-cli && cp config.example.yaml ~/.nacos-cli/config.yaml && chmod 600 ~/.nacos-cli/config.yaml
#
# 也可以用 NACOS_CONFIG_FILE 指定其他路径，或用 --config 只对单条命令生效。
# 优先级：命令行参数 > 环境变量 > 本文件 > 内置默认值
# 下面没写的字段（或留空/设为 false）表示「不覆盖」，会继续用环境变量或默认值。

# Nacos 地址，注意要带 context path
addr: http://127.0.0.1:8848/nacos

# 开启鉴权时必填；未开启鉴权可整段删掉
username: nacos
password: change-me

# 命名空间 ID（不是控制台里的显示名）。
# public 是默认空间，其真实 ID 是空字符串，这里写 public 会被自动转换。
namespace: public

# 分组
group: DEFAULT_GROUP

# 接口版本，默认 v1
apiVersion: v1

# HTTPS 使用自签证书时设为 true，等价于命令行 -k/--insecure
insecure: false

# 也可以完全不用账号密码，直接贴一个现成的 accessToken（优先级高于账号密码）
# accessToken: ""
